services:
  api:
    image: ${MOTLY_API_IMAGE:-ghcr.io/germanmoramacias/motly-api:latest}
    container_name: motly-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - homelab

  quiz-worker:
    image: ${MOTLY_API_IMAGE:-ghcr.io/germanmoramacias/motly-api:latest}
    restart: unless-stopped
    env_file:
      - .env
    command: python -m app.modules.quiz.worker
    stop_grace_period: 120s

networks:
  homelab:
    external: true
