name: Deploy Motly API

on:
  push:
    branches:
      - main

concurrency:
  group: motly-api-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  build:
    needs: verify
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/germanmoramacias/motly-api:latest
            ghcr.io/germanmoramacias/motly-api:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build

    runs-on:
      - self-hosted
      - Linux
      - ARM64

    steps:
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Update repository
        working-directory: /home/german/server/apps/motly-api
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Deploy with backup and recovery checkpoint
        working-directory: /home/german/server/apps/motly-api
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy.sh "$RELEASE_SHA"
