name: Test Motly API
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quiz-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: motly_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/motly_test
      QUIZ_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/motly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Verify migrations in PostgreSQL
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Run API and concurrency tests in isolated schemas
        run: python -m unittest discover -s tests -v
